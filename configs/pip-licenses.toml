# pip-licenses config — supports both verbose names AND SPDX short names.
# pip-licenses can return either depending on package metadata.

[allowed]
licenses = [
  # SPDX short identifiers
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache 2.0",
  "BSD",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSD-3-Clause-Clear",
  "ISC",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "PSF-2.0",
  "Python-2.0",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "MPL-2.0+",
  "HPND",
  "WTFPL",
  "BlueOak-1.0.0",
  # Verbose names (pip-licenses legacy)
  "MIT License",
  "Apache Software License",
  "Apache License 2.0",
  "BSD License",
  "ISC License (ISCL)",
  "Python Software Foundation License",
  "The Unlicense (Unlicense)",
  "Mozilla Public License 2.0 (MPL 2.0)",
  "Public Domain",
  "Zlib License",
  "Historical Permission Notice and Disclaimer (HPND)"
]

[blocked]
licenses = [
  "GPL-1.0",
  "GPL-2.0",
  "GPL-2.0-only",
  "GPL-2.0-or-later",
  "GPL-3.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "AGPL-1.0",
  "AGPL-3.0",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "SSPL-1.0",
  "BUSL-1.1",
  "Commons-Clause",
  # Verbose
  "GNU General Public License v1 (GPLv1)",
  "GNU General Public License v2 (GPLv2)",
  "GNU General Public License v3 (GPLv3)",
  "GNU General Public License (GPL)",
  "GNU Affero General Public License v3",
  "GNU Affero General Public License v3 or later (AGPLv3+)",
  "Server Side Public License",
  "Business Source License 1.1"
]

[review_required]
licenses = [
  # LGPL = linker copyleft, weaker than GPL but flag for review
  "LGPL-2.1",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  # Other weak-copyleft / less common
  "MPL-1.0",
  "MPL-1.1",
  "EPL-1.0",
  "EPL-2.0",
  "CDDL-1.0",
  "CDDL-1.1",
  "CECILL-2.1",
  # Custom / unclassified
  "Other/Proprietary License",
  "UNKNOWN",
  # Verbose
  "GNU Lesser General Public License v2 (LGPLv2)",
  "GNU Lesser General Public License v3 (LGPLv3)",
  "GNU Library or Lesser General Public License (LGPL)",
  "Eclipse Public License 2.0 (EPL-2.0)",
  "Common Development and Distribution License 1.0 (CDDL-1.0)"
]
